name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm --workspace=@hyojo/api run smoke
      - run: npm --workspace=@hyojo/admin run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hyojo
          POSTGRES_USER: hyojo
          POSTGRES_PASSWORD: hyojo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hyojo -d hyojo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://hyojo:hyojo@localhost:5432/hyojo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm --workspace=@hyojo/api run smoke
